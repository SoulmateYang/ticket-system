# Database schema auto-created by JPA (ddl-auto: update)
# For production, use Flyway migrations: src/main/resources/db/migration/V1__create_staff_table.sql
# To disable auto-DDL, set spring.jpa.hibernate.ddl-auto: validate

spring:
  application:
    name: scenic-ticket-platform
  datasource:
    url: jdbc:mysql://localhost:3306/scenic_ticket?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 生产用 validate，由 Flyway 管理 schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: 101.42.92.205
      port: 6379
      # password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  port: 8090

jwt:
  secret: your_256_bit_secure_random_string_minimum_32_characters
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

logging:
  level:
    com.scenic.ticket: INFO
    org.hibernate.SQL: WARN